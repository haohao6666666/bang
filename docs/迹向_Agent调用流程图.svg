iddle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">保留原始记录</text><rect x="912" y="248" width="373" height="102" rx="14" fill="#F7FCFF" stroke="#2D78C8" stroke-width="2"/><text x="1098.5" y="276" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="18px" font-weight="700" fill="#16324F">generateDailyEcho</text><text x="1098.5" y="304" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">整理事实、识别信号</text><text x="1098.5" y="324" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">不改任务/计时/日期/印章</text><rect x="912" y="432" width="373" height="118" rx="14" fill="#F7FCFF" stroke="#2D78C8" stroke-width="2"/><text x="1098.5" y="460" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="18px" font-weight="700" fill="#16324F">结构化草稿</text><text x="1098.5" y="488" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">facts · signals · sparkle</text><text x="1098.5" y="508" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">quiet · evidenceRefs</text><rect x="912" y="704" width="373" height="102" rx="14" fill="#F7FCFF" stroke="#2D78C8" stroke-width="2"/><text x="1098.5" y="732" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="18px" font-weight="700" fill="#16324F">不需要外部经验</text><text x="1098.5" y="760" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">只保留本机事实</text><text x="1098.5" y="780" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">不触发检索</text><rect x="1347" y="248" width="373" height="102" rx="14" fill="#F7FCFF" stroke="#2D78C8" stroke-width="2"/><text x="1533.5" y="276"