<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1250" viewBox="0 0 2200 1250"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#2D78C8"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#36A77A"/></marker></defs><rect width="2200" height="1250" fill="#FBFCFD"/><text x="1100" y="75" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="42px" font-weight="800" fill="#152E46">迹向 · 每日回声 Agent 调用流程</text><text x="1100" y="120" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="23px" font-weight="700" fill="#45606D">本机记录 → 授权门 → 理解当天 → 证据适配 → 用户确认</text><rect x="18" y="150" width="421" height="860" rx="18" fill="#E8F4FC" stroke="#B8D9F2" stroke-width="3"/><circle cx="63" cy="195" r="27" fill="#2D78C8"/><text x="63" y="202" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="21px" font-weight="700" fill="white">01</text><text x="104" y="202" text-anchor="start" font-family="Source Han Sans SC, sans-serif" font-size="24px" font-weight="700" fill="#152E46">本机记录与授权</text><rect x="453" y="150" width="421" height="860" rx="18" fill="#FFF5E3" stroke="#F1D7A5" stroke-width="3"/><circle cx="498" cy="195" r="27" fill="#D89A34"/><text x="498" y="202" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="21px" font-weight="700" fill="white">02</text><text x="539" y="202" text-anchor="start" font-family="Source Han Sans SC, sans-serif" font-size="24px" font-weight="700" fill="#152E46">输入校验与权限</text><rect x="888" y="150" width="421" height="860" rx="18" fill="#F1ECFF" stroke="#D7C3F2" stroke-width="3"/><circle cx="933" cy="195" r="27" fill="#8756D4"/><text x="933" y="202" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="21px" font-weight="700" fill="white">03</text><text x="974" y="202" text-anchor="start" font-family="Source Han Sans SC, sans-serif" font-size="24px" font-weight="700" fill="#152E46">Agent 理解当天</text><rect x="1323" y="150" width="421" height="860" rx="18" fill="#F5EEFF" stroke="#DCC7EB" stroke-width="3"/><circle cx="1368" cy="195" r="27" fill="#8756D4"/><text x="1368" y="202" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="21px" font-weight="700" fill="white">04</text><text x="1409" y="202" text-anchor="start" font-family="Source Han Sans SC, sans-serif" font-size="24px" font-weight="700" fill="#152E46">证据适配与周回声</text><rect x="1758" y="150" width="421" height="860" rx="18" fill="#E8F4FC" stroke="#B8D9F2" stroke-width="3"/><circle cx="1803" cy="195" r="27" fill="#2D78C8"/><text x="1803" y="202" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="21px" font-weight="700" fill="white">05</text><text x="1844" y="202" text-anchor="start" font-family="Source Han Sans SC, sans-serif" font-size="24px" font-weight="700" fill="#152E46">确认与展示</text><rect x="42" y="248" width="373" height="102" rx="14" fill="#F7FCFF" stroke="#2D78C8" stroke-width="2"/><text x="228.5" y="276" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="18px" font-weight="700" fill="#16324F">用户留下记录</text><text x="228.5" y="304" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">成果、继续点、卡点、日记</text><text x="228.5" y="324" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">写入本机 v5 状态</text><rect x="42" y="382" width="373" height="102" rx="14" fill="#F7FCFF" stroke="#2D78C8" stroke-width="2"/><text x="228.5" y="410" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="18px" font-weight="700" fill="#16324F">点击生成回声</text><text x="228.5" y="438" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">保存