ze="18px" font-weight="700" fill="#16324F">本地校验与去重</text><text x="1968.5" y="304" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">schema / evidenceRefs</text><text x="1968.5" y="324" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">不让 Agent 计算印章</text><rect x="1782" y="397" width="373" height="102" rx="14" fill="#F7FCFF" stroke="#2D78C8" stroke-width="2"/><text x="1968.5" y="425" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="18px" font-weight="700" fill="#16324F">展示草稿</text><text x="1968.5" y="453" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">今日回声 / 闪耀瞬间</text><text x="1968.5" y="473" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">明天试一试 / 来源说明</text><rect x="1782" y="668" width="373" height="102" rx="14" fill="#F7FCFF" stroke="#2D78C8" stroke-width="2"/><text x="1968.5" y="696" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="18px" font-weight="700" fill="#16324F">确认后写回本机</text><text x="1968.5" y="724" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">dailyEchoes / experiments</text><text x="1968.5" y="744" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="400" fill="#244055">印迹册继续只读事实</text><polygon points="663.5,392 834.0,429.0 663.5,466 493.0,429.0" fill="#FFF0CE" stroke="#D79A34" stroke-width="2"/><text x="663.5" y="434.0" text-anchor="middle" font-family="Source Han Sans SC, sans-serif" font-size="14px" font-weight="700" fill="#5E461F">输入与授权是否合法？</text><polygon points="1098.5,584 1269.0,621.0 1098.5,658 928.0,621.0" fill="#FFF0CE" stroke="#D79A34" stroke-width="2"/><text x="1098.5" y="626.0" text-anchor="middle" font-family